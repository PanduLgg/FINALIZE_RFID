      <path id="archMotto" d="M 268 86 A 32 32 0 0 0 328 86" fill="none" />
      <text fill="#FFFFFF" font-size="6.5" font-family="'Arial', sans-serif" font-weight="900" letter-spacing="0.8">
        <textPath href="#archMotto" startOffset="50%" text-anchor="middle">
